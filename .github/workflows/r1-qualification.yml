name: R1 structural qualification

on:
  pull_request:
    paths:
      - ".codex-plugin/**"
      - "skills/**"
      - "qualification/**"
      - "scripts/**"
      - "tests/**"
      - "worker/**"
      - "docs/PROTOCOL.md"
      - "package.json"
      - "package-lock.json"
      - "wrangler.jsonc"
      - ".github/workflows/r1-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0

      - name: Prove exact candidate checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Seed stale dependency environment
        shell: bash
        run: |
          mkdir -p node_modules
          printf 'stale dependency fixture\n' > node_modules/pryzael-r1-stale-marker

      - name: Run standalone fail-closed R1 qualification
        run: npm run check

      - name: Prove lockfile install replaced stale dependency environment
        shell: bash
        run: test ! -e node_modules/pryzael-r1-stale-marker

      - name: Verify historical R1 oracle for qualification-architecture-only changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --quiet "$BASE_SHA" "$EXPECTED_SHA" -- skills; then
            if ! git diff --quiet "$BASE_SHA" "$EXPECTED_SHA" -- \
              package.json \
              qualification/head-semantic-authority.json \
              scripts/qualify_head_semantic_authority.mjs \
              scripts/qualify_r1.mjs \
              tests/qualification-gates.test.mjs \
              tests/structural-conformance.test.mjs \
              .github/workflows/r1-qualification.yml; then
              npm run qualify:r1:frozen
            fi
          fi
