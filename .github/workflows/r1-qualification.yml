name: R1 structural qualification

on:
  pull_request:
    paths:
      - ".codex-plugin/**"
      - "skills/**"
      - "scripts/**"
      - "tests/**"
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - "wrangler.jsonc"
      - ".github/workflows/r1-qualification.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}

      - name: Prove exact candidate checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install current project dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Bootstrap dependency lock into feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock R1 build dependencies"
          git push origin HEAD:vnext/r1-structural-conformance
